name: Build Simple Exam App APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: run: |
  ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
  if [ -z "$ZIP_FILE" ]; then
    echo "ZIP file not found!"
    exit 1
  fi
  unzip -q "$ZIP_FILE" -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Exam-App-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
